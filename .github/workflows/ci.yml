# Build + test on every push to master and every PR.
# Cross-platform matrix: Core + Console build everywhere; Windows tray
# only on windows-latest (needs net10.0-windows + WinForms).

name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: release boundary tests
        run: node --test tests/release.test.mjs
      - name: dotnet build (Core)
        run: dotnet build src/NeverAway.Core/NeverAway.Core.csproj -c Release
      - name: dotnet test
        run: dotnet test tests/NeverAway.Core.Tests/NeverAway.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  # NeverAway.app bundle build is on macos-latest because we need
  # `codesign` + `xcrun notarytool` + `xcrun stapler` to sign + notarize
  # the bundle. With Developer ID signing wired up, gatekeeper accepts
  # the .app on first launch without any "could not be verified"
  # warning.
  #
  # Tagged releases require all five credentials. Development artifacts
  # remain ad-hoc signed and cannot pass the release installer:
  #   APPLE_DEV_ID_CERT_P12          -- base64 of the Developer ID Application .p12
  #   APPLE_DEV_ID_CERT_PWD          -- the .p12's password
  #   APPLE_ID                       -- Apple ID email (for notarytool)
  #   APPLE_APP_SPECIFIC_PASSWORD    -- app-specific password from appleid.apple.com
  #   APPLE_TEAM_ID                  -- 10-char Team ID (visible in dev portal Membership)
  build-mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: require release signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_P12_B64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_DEV_ID_CERT_P12 || '' }}
          CERT_PWD: ${{ secrets.APPLE_DEV_ID_CERT_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/check-release-credentials.sh
      - name: download verified Sparkle
        run: bash scripts/download-sparkle.sh
      - name: dotnet publish (NeverAway.Mac, osx-arm64 single-file)
        run: dotnet publish src/NeverAway.Mac/NeverAway.Mac.csproj -c Release -o publish/mac-binary

      # Release signing is required on tags; other builds use ad-hoc signing.
      - name: assemble NeverAway.app bundle + codesign
        env:
          CERT_P12_B64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_DEV_ID_CERT_P12 || '' }}
          CERT_PWD: ${{ secrets.APPLE_DEV_ID_CERT_PWD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=publish/mac-app/NeverAway.app
          mkdir -p $APP/Contents/MacOS
          cp src/NeverAway.Mac/Info.plist $APP/Contents/Info.plist
          cp publish/mac-binary/neveraway $APP/Contents/MacOS/neveraway
          chmod +x $APP/Contents/MacOS/neveraway

          # Embed Sparkle.framework for auto-updates (Program.cs dlopens
          # Contents/Frameworks/Sparkle.framework/Sparkle at launch).
          mkdir -p $APP/Contents/Frameworks
          cp -R "$RUNNER_TEMP/sparkle/Sparkle.framework" $APP/Contents/Frameworks/
          # Sparkle's XPC services are only needed by sandboxed hosts;
          # NeverAway isn't sandboxed. Removing them simplifies signing.
          rm -rf $APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices

          if [ -n "$CERT_P12_B64" ]; then
            echo "::group::Developer ID signing path"
            # Temp keychain holds the cert just for this build.
            KC_PATH="$RUNNER_TEMP/build.keychain-db"
            KC_PWD=$(uuidgen)
            security create-keychain -p "$KC_PWD" "$KC_PATH"
            security set-keychain-settings -lut 21600 "$KC_PATH"
            security unlock-keychain -p "$KC_PWD" "$KC_PATH"

            echo "$CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PWD" -k "$KC_PATH" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"

            # Add temp keychain to search list so codesign + xcrun find the cert.
            KEYCHAINS=()
            while IFS= read -r path; do KEYCHAINS+=("$path"); done < <(security list-keychains -d user | sed 's/^ *"//;s/"$//')
            security list-keychains -d user -s "$KC_PATH" "${KEYCHAINS[@]}"
            # Allow codesign to use the private key without an interactive prompt.
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" "$KC_PATH" >/dev/null

            # Resolve the cert identity by team ID -- avoids hardcoding the CN.
            IDENTITY=$(security find-identity -v -p codesigning "$KC_PATH" | \
              awk -v team="($TEAM_ID)" '/Developer ID Application/ && index($0,team) {print $2; exit}')
            if [ -z "$IDENTITY" ]; then
              echo "ERROR: could not find Developer ID Application cert with team $TEAM_ID" >&2
              security find-identity -v -p codesigning "$KC_PATH" >&2
              exit 1
            fi
            echo "signing with identity: $IDENTITY"
            # Sign nested Sparkle pieces first (inside-out). No --deep on
            # the final app sign: --deep would re-sign nested code with the
            # app's entitlements, and Sparkle's helpers must NOT carry the
            # .NET JIT entitlements.
            FW=$APP/Contents/Frameworks/Sparkle.framework
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW/Versions/B/Autoupdate"
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW/Versions/B/Updater.app"
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW"
            # --entitlements: required for the .NET runtime to function under
            # hardened runtime. Without allow-jit + allow-unsigned-executable-
            # memory + disable-library-validation, CoreCLR can't initialize
            # and the app fails on launch with HRESULT 0x80070008.
            codesign --force --options runtime --timestamp \
              --entitlements src/NeverAway.Mac/Entitlements.plist \
              --sign "$IDENTITY" "$APP"
            echo "::endgroup::"
          else
            echo "::warning::No APPLE_DEV_ID_CERT_P12 secret; falling back to ad-hoc signing. Gatekeeper will warn users on first launch."
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --strict --verbose=2 "$APP"
          cp dist/mac-app/README.txt publish/mac-app/README.txt

      # Notarize + staple release builds. Development artifacts skip this.
      # Stapling attaches the verdict ticket to the .app so it verifies
      # offline (without contacting Apple at launch time).
      - name: notarize + staple
        env:
          CERT_P12_B64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_DEV_ID_CERT_P12 || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT_P12_B64" ]; then
            echo "::warning::No signing creds; skipping notarization."
            exit 0
          fi

          APP=publish/mac-app/NeverAway.app
          ZIP="$RUNNER_TEMP/notarize.zip"

          # notarytool wants a flat archive of the bundle.
          # ditto preserves the bundle structure (unlike `zip`).
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          rm "$ZIP"

      # ditto preserves executable bits, symlinks, and the stapled ticket --
      # actions/upload-artifact's own zipping strips the exec bit, which
      # breaks a downloaded .app. This zip is also what ships in releases
      # and what generate_appcast signs for Sparkle.
      - name: ditto-zip app bundle
        run: |
          VER=$(defaults read "$PWD/publish/mac-app/NeverAway.app/Contents/Info.plist" CFBundleShortVersionString)
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent publish/mac-app/NeverAway.app "publish/NeverAway-$VER.zip"

      - name: verify delivered release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(defaults read "$PWD/publish/mac-app/NeverAway.app/Contents/Info.plist" CFBundleShortVersionString)
          test "$GITHUB_REF_NAME" = "v$VER"
          ditto -x -k "publish/NeverAway-$VER.zip" "$RUNNER_TEMP/release-check"
          bash scripts/verify-mac-release.sh "$RUNNER_TEMP/release-check/NeverAway.app"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neveraway-mac-app
          path: publish/mac-app/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neveraway-mac-zip
          path: publish/NeverAway-*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Windows PowerShell installer checks
        shell: powershell
        run: ./tests/install-windows.test.ps1
      - name: dotnet build (Windows tray)
        run: dotnet build src/NeverAway.Windows/NeverAway.Windows.csproj -c Release
      - name: dotnet publish (Windows tray, win-x64 single-file)
        run: dotnet publish src/NeverAway.Windows/NeverAway.Windows.csproj -c Release -o publish/win-x64
      - name: copy per-platform README into publish dir
        shell: bash
        run: cp dist/win-x64/README.txt publish/win-x64/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neveraway-win-x64
          path: publish/win-x64/

  # Tag push (v*) -> GitHub release with the mac zip, windows zip, and a
  # Sparkle appcast.xml. SUFeedURL in Info.plist points at
  # releases/latest/download/appcast.xml, so publishing the release is
  # what makes installed apps see the update. Tag must match the version
  # in src/NeverAway.Mac/Info.plist (bump it before tagging).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-mac-app, build-windows]
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: download verified Sparkle
        run: bash scripts/download-sparkle.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: neveraway-mac-zip
          path: appcast-dir
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: neveraway-win-x64
          path: win-x64

      # generate_appcast scans a directory of archives, unpacks each to
      # read Info.plist versions, and writes EdDSA signatures with the
      # private key. Only the mac zip may be in that directory.
      - name: generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/ed_key"
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/ed_key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            -o appcast-dir/appcast.xml \
            appcast-dir
          rm "$RUNNER_TEMP/ed_key"
          cat appcast-dir/appcast.xml

      - name: zip windows build
        run: /usr/bin/ditto -c -k win-x64 "appcast-dir/NeverAway-win-x64.zip"

      - name: sign Windows archive
        env:
          WINDOWS_RELEASE_KEY: ${{ secrets.WINDOWS_RELEASE_KEY }}
        run: node scripts/sign-windows-release.mjs appcast-dir/NeverAway-win-x64.zip

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" appcast-dir/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NeverAway $GITHUB_REF_NAME" \
            --generate-notes
